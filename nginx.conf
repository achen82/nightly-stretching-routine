server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # no-cache: iOS otherwise happily serves a stale copy of the app
        # page long after an update has been deployed.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # App state API (the api service in docker-compose). The resolver +
    # variable form defers DNS lookup to request time, so nginx starts
    # even if the api container is still coming up.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
